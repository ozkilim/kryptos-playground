[project]
name = "kryptos-playground"
version = "0.2.0"
description = "Workbench for attacking Kryptos K4: data, ciphers, scorers, blind solvers, experiment ledger."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kryptos = "kryptos.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kryptos", "kryptos.ciphers", "kryptos.solvers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
